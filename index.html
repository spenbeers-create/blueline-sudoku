<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blueline</title>
<meta name="description" content="Ad-free games: Sudoku, chess, checkers, Four in a Row, Crazy Eights, Word Duel and Short Fuse, online, on one phone, or on the TV.">
<meta name="theme-color" content="#EEF2F7" id="meta-theme">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blueline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Lexend:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/games.css">
</head>
<body>

<main id="hub" class="screen home hub" aria-labelledby="hub-name">
  <div class="home-inner">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="1" y="1" width="28" height="28" rx="7" class="bm-bg"/>
        <rect x="4" y="4" width="22" height="7.33" class="bm-lane"/>
        <rect x="18.67" y="4" width="7.33" height="22" class="bm-lane"/>
        <rect x="18.67" y="4" width="7.33" height="7.33" rx="1.5" class="bm-dot"/>
        <path d="M11.33 4v22M18.67 4v22M4 11.33h22M4 18.67h22" class="bm-grid"/>
      </svg>
      <div class="brand-text">
        <h1 id="hub-name">Blueline</h1>
        <p id="hub-today" class="today"></p>
      </div>
      <button type="button" class="icon-btn" id="hub-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.7 7.7 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z"/></svg>
      </button>
    </header>
    <section class="pair-card" id="pair-card" aria-live="polite"></section>
    <div id="hub-lists"></div>
    <section class="games-sec" aria-labelledby="games-h">
      <h2 id="games-h">Games</h2>
      <div class="game-grid" id="hub-games"></div>
      <p class="coming" id="hub-coming"></p>
    </section>
  </div>
</main>

<main id="home" class="screen home" aria-labelledby="brand-name" hidden>
  <div class="home-inner">
    <header class="brand">
      <button type="button" class="icon-btn" id="home-back" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <svg class="brand-mark sm" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="1" y="1" width="28" height="28" rx="7" class="bm-bg"/>
        <rect x="4" y="4" width="22" height="7.33" class="bm-lane"/>
        <rect x="18.67" y="4" width="7.33" height="22" class="bm-lane"/>
        <rect x="18.67" y="4" width="7.33" height="7.33" rx="1.5" class="bm-dot"/>
        <path d="M11.33 4v22M18.67 4v22M4 11.33h22M4 18.67h22" class="bm-grid"/>
      </svg>
      <div class="brand-text">
        <h1 id="brand-name">Sudoku</h1>
        <p id="today" class="today"></p>
      </div>
      <button class="icon-btn" id="open-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.7 7.7 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z"/></svg>
      </button>
    </header>

    <button class="resume" id="resume" hidden>
      <span class="resume-k">Continue</span>
      <span class="resume-t" id="resume-title"></span>
      <span class="resume-m" id="resume-meta"></span>
      <svg class="resume-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>

    <section class="panel" aria-labelledby="new-h">
      <h2 id="new-h">New game</h2>
      <div class="pick-row">
        <span class="pick-label" id="lbl-variant">Style</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-variant" id="pick-variant">
          <button type="button" role="radio" data-v="classic">Classic</button>
          <button type="button" role="radio" data-v="diagonal">Diagonal</button>
          <button type="button" role="radio" data-v="killer">Killer</button>
        </div>
      </div>
      <div class="pick-row">
        <span class="pick-label" id="lbl-size">Grid</span>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-size" id="pick-size">
          <button type="button" role="radio" data-v="9">9×9</button>
          <button type="button" role="radio" data-v="12">12×12</button>
          <button type="button" role="radio" data-v="16">16×16</button>
        </div>
      </div>
      <p class="pick-note" id="variant-note"></p>
      <div class="levels" role="radiogroup" aria-label="Difficulty" id="pick-level"></div>
      <button type="button" class="btn primary big" id="start">Start</button>
    </section>

    <div class="duo">
      <button type="button" class="tile" id="daily">
        <span class="tile-k">Daily puzzle</span>
        <span class="tile-t" id="daily-title"></span>
        <span class="tile-m" id="daily-meta"></span>
      </button>
      <button type="button" class="tile tile-race" id="race">
        <span class="tile-k">Race</span>
        <span class="tile-t">Head to head</span>
        <span class="tile-m" id="race-meta">Same puzzle, live</span>
      </button>
    </div>

    <button type="button" class="tile tv-tile" id="sudoku-tv">
      <span class="tile-k">TV mode</span>
      <span class="tile-t">Race on the big screen</span>
      <span class="tile-m">Up to 8 players solve the same puzzle on their phones while the TV shows everyone’s progress. Open Blueline in a TV’s web browser, or on a laptop plugged into the TV, and tap here.</span>
    </button>

    <section class="panel">
      <h2>Race a group</h2>
      <p class="pick-note">Up to 8 players on the same puzzle, each on their own phone. Uses the style, grid and level picked above.</p>
      <div class="actions row"><button type="button" class="btn" id="sudoku-room-new">Make a room</button><button type="button" class="btn" id="sudoku-room-join">Join a room</button></div>
    </section>

    <nav class="home-links" aria-label="More">
      <button type="button" id="open-stats">Stats</button>
      <button type="button" id="open-code">Puzzle code</button>
      <button type="button" id="install" hidden>Install app</button>
    </nav>
  </div>
</main>

<main id="menu" class="screen home menu" aria-labelledby="menu-title" hidden>
  <div class="home-inner">
    <header class="brand">
      <button type="button" class="icon-btn" id="menu-back" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="brand-text"><h1 id="menu-title"></h1></div>
      <button type="button" class="icon-btn" id="menu-look" aria-label="Board and pieces">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A4.6 4.6 0 0 0 22 9.8C22 6 17.5 3 12 3Z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="14.5" cy="7" r="1.2"/><circle cx="17" cy="10.5" r="1.2"/></svg>
      </button>
    </header>
    <div id="menu-body" class="menu-body"></div>
  </div>
</main>

<section id="game" class="screen game" hidden aria-label="Game">
  <header class="game-head">
    <button type="button" class="icon-btn" id="g-home" aria-label="Back to menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="g-title"><strong id="g-level"></strong><span id="g-kind"></span></div>
    <div class="strikes" id="g-strikes" role="img" aria-label="Mistakes"></div>
    <span class="g-clock" id="g-clock">0:00</span>
    <button type="button" class="icon-btn" id="g-pause" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
    </button>
  </header>

  <div class="race-bar" id="race-bar" hidden>
    <div class="rb-row"><span class="rb-who">You</span><span class="rb-track"><span class="rb-fill me" id="rb-me"></span></span><span class="rb-pct" id="rb-me-pct">0%</span></div>
    <div class="rb-row"><span class="rb-who" id="rb-name">Them</span><span class="rb-track"><span class="rb-fill them" id="rb-them"></span></span><span class="rb-pct" id="rb-them-pct">0%</span></div>
    <p class="rb-note" id="rb-note" hidden></p>
  </div>

  <div class="stage" id="stage">
    <div class="board-wrap" id="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
      <svg class="overlay" id="overlay" aria-hidden="true" preserveAspectRatio="none"></svg>
      <button type="button" class="cover" id="cover" hidden><span>Paused</span><small>Tap to keep going</small></button>
      <div class="countdown" id="countdown" hidden></div>
    </div>
  </div>

  <div class="controls" id="controls">
    <div class="tools">
      <button type="button" class="tool" id="t-undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Undo</span></button>
      <button type="button" class="tool" id="t-erase"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20H9L3.6 14.6a2 2 0 0 1 0-2.8L12.8 2.6a2 2 0 0 1 2.8 0l4.8 4.8a2 2 0 0 1 0 2.8L11 19.6"/><path d="M8 9.4l6.6 6.6"/></svg><span>Erase</span></button>
      <button type="button" class="tool" id="t-notes" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="M13.5 6.5l4 4"/></svg><span>Notes</span><b class="pill" id="notes-pill">Off</b></button>
      <button type="button" class="tool" id="t-fill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01"/></svg><span>Fill notes</span></button>
      <button type="button" class="tool" id="t-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3Z"/></svg><span>Hint</span></button>
    </div>
    <div class="pad" id="pad"></div>

    <div class="hint" id="hint" hidden role="region" aria-live="polite" aria-labelledby="hint-name">
      <div class="hint-head">
        <span class="hint-k">Hint</span>
        <strong id="hint-name"></strong>
        <button type="button" class="icon-btn small" id="hint-close" aria-label="Close hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <ol class="hint-steps" id="hint-steps"></ol>
      <p class="hint-text" id="hint-text"></p>
      <button type="button" class="btn primary" id="hint-apply">Place it</button>
    </div>
  </div>
</section>

<section id="play" class="screen game play" hidden aria-label="Game">
  <header class="game-head">
    <button type="button" class="icon-btn" id="p-back" aria-label="Back to all games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="g-title"><strong id="p-title"></strong><span id="p-sub"></span></div>
    <button type="button" class="icon-btn" id="p-menu" aria-label="Game menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
    </button>
  </header>
  <div class="p-players" id="p-players"></div>
  <div class="p-body" id="p-body"></div>
  <div class="p-result" id="p-result" hidden></div>
</section>

<section id="tv" class="screen tv" hidden aria-label="TV mode"></section>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/engine.js"></script>
<script src="js/net.js"></script>
<script src="js/app.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/online.js"></script>
<script src="js/games/four.js"></script>
<script src="js/games/chess.js"></script>
<script src="js/games/eights.js"></script>
<script src="js/games/checkers.js"></script>
<script src="js/games/checkers-ai.js"></script>
<script src="js/games/words.js"></script>
<script src="js/games/fuse-prompts.js"></script>
<script src="js/games/fuse.js"></script>
<script src="js/views.js"></script>
<script src="js/rooms.js"></script>
<script src="js/games/chess-ai.js"></script>
<script src="js/games/chess-view.js"></script>
<script src="js/menus/chess-menu.js"></script>
<script src="js/games/words-view.js"></script>
<script src="js/menus/words-menu.js"></script>
<script src="js/games/four-ai.js"></script>
<script src="js/games/four-view.js"></script>
<script src="js/menus/four-menu.js"></script>
<script src="js/games/checkers-view.js"></script>
<script src="js/menus/checkers-menu.js"></script>
<script src="js/games/eights-view.js"></script>
<script src="js/menus/eights-menu.js"></script>
<script src="js/games/fuse-view.js"></script>
<script src="js/menus/fuse-menu.js"></script>
<script src="js/tv.js"></script>
<script src="js/games/fuse-tv.js"></script>
<script src="js/games/four-tv.js"></script>
<script src="js/games/eights-tv.js"></script>
<script src="js/games/chess-tv.js"></script>
<script src="js/games/checkers-tv.js"></script>
<script src="js/games/words-tv.js"></script>
<script src="js/sudoku-room.js"></script>
<script src="js/games/sudoku-tv.js"></script>
<script src="js/hub.js"></script>
</body>
</html>
